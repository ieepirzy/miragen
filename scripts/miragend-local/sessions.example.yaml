# ~/.config/miragend/sessions.yaml — miragend's session plane
# (docs/external-sessions.md, design record docs/design/external-sessions.md).

# The memory principal the daemon authenticates as (LOIMI_MEMORY_TOKEN was
# minted for it). New project scopes are granted to this principal.
principal: assistant

endpoint_env: LOIMI_MEMORY_URL
credential_env: LOIMI_MEMORY_TOKEN
operator_token_env: LOIMI_OPERATOR_TOKEN

scopes:
  # Read-only layers every external session gets (stable assistant/user
  # context). Must already exist and be granted to the principal.
  shared_read: [profile:assistant]
  # One scope per project; {slug} is the normalized repository identity
  # (remote URL → "github.com-org-repo"; no remote → the path).
  project_scope: "group:project.{slug}"
  project_scope_kind: group
  # auto: create the project scope + grants on first sight (needs the
  # operator token). manual: assume it exists; a refusal degrades
  # explicitly in the injected packet and on /health.
  provision: auto
  # Where writes go when a project scope cannot be provisioned. null =
  # degrade explicitly rather than write somewhere unrelated.
  fallback_write: null

  # A session that could only be identified by its directory name (a cloud
  # VM posting a bare path) joins the project already known under that
  # repository name instead of opening a parallel `dir:` project.
  adopt_by_name: true

# When the credential env is unset and the operator token is available, the
# daemon creates its principal (or mints a token for an existing one) at
# startup and keeps the token in the state dir. One secret to deploy.
provision_principal: true

# Loimi ARTIFACT store (/v0): each session gets a run; episodes are filed as
# artifacts under it; the bridge's store_* tools write against it. The store
# bearer comes from LOIMI_STORE_TOKEN or, failing that, the operator token
# (they are the same credential on a Loimi deployment).
store:
  enabled: true
  agent_id: mira            # registered Loimi agent the runs belong to
  namespace: mira           # default namespace for a session's run
  namespaces: []            # project → namespace bindings, e.g.
  #  - match: github.com/muutto365/movingfirm-backend
  #    namespace: muutto365
  #  - match: github.com/ieepirzy/loimi
  #    namespace: infra
  episode_kind: session_episode

# The bridge MCP mount (/mcp): memory_* + store_* tools for external sessions.
# Guarded by the daemon bearer and, when MCP_BASE_URL/MCP_CLIENT_ID/
# MCP_CLIENT_SECRET are set, by origo OAuth (claude.ai custom connectors).
mcp:
  enabled: true
  default_project: "mcp:default"   # tool calls that name no project

# Explicit bindings beat the template — e.g. two repositories that share
# one body of project memory, or a project that may also read a shared
# platform scope.
projects: []
#  - match: github.com/ieepirzy/miragen
#    scope: group:mira-platform
#    read: [shared:platform]
#  - match: /home/ilari/Software/Repositories/movingfirm-backend
#    scope: group:muutto365

recall:
  enabled: true
  # The zero-or-more relevance selector (one structured-output model call
  # per new prompt/state; cache hits are free). Unset = optional lane off.
  model: null            # e.g. "deepseek:deepseek-chat"
  on_prompt: true
  min_prompt_chars: 20
  max_candidates: 20
  max_selected: 8
  max_optional_chars: 8000

housekeeping:
  retention_hours: 24          # keep ended sessions listed this long
  stale_after_minutes: 180     # a pid-less session silent this long is finalized
  sweep_interval_seconds: 60

# Codex + Grok Build on THIS machine: the daemon writes their hooks, Codex
# hook trust and the bridge MCP entry into ~/.codex and ~/.grok (or
# CODEX_HOME / GROK_HOME from this unit's environment), at startup and every
# interval_s. Off until `url` is set — the bridge harness sessions report to
# (the hosted one), never guessed. Status: GET /health → harness_setup.
harness_setup:
  url: null                    # e.g. https://memory.muutto365.fi
  token_file: null             # e.g. ~/.config/miragend/bridge.token (0600)
  # enabled: true              # default: on when url is set, off in a container
  # interval_s: 600
