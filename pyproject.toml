[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miragen"
version = "0.2.0"
description = "YAML-defined agent orchestration framework powered by PydanticAI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "ieepirzy", email = "nervy_colder_1m@icloud.com" },
]
keywords = ["ai", "agents", "pydantic-ai", "llm", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "markdownify>=0.13",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.30",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "click>=8.0",
    # Pinned exactly to the version verified to provide the web-fetch/
    # duckduckgo/mcp/openai extras. Leaving it unpinned lets pip's resolver
    # backtrack across releases that predate the web-fetch extra, which
    # blows past resolvelib's max_rounds (see issue #45). We depend on
    # pydantic-ai-slim directly rather than the bare `pydantic-ai` meta-
    # package: `pydantic-ai` unconditionally pulls in a fixed 19-extra
    # bundle (including "fastmcp", which nothing in miragen imports) that
    # requires fastmcp>=3.3.0, conflicting with kimi-cli's fastmcp==2.12.5
    # pin (the kimi-code executor backend). pydantic-ai-slim gives us only
    # the extras we actually use.
    "pydantic-ai-slim[web-fetch,duckduckgo,mcp,openai]==1.106.0",
    # mcp 2.x (PyPI since 2026-07-28) renamed FastMCP to MCPServer and
    # changed other APIs; miragen/intervention_mcp.py imports the v1
    # `mcp.server.fastmcp.FastMCP` directly. pydantic-ai-slim's `mcp` extra
    # does not itself upper-bound this, so an unconstrained resolver can
    # silently pick an incompatible mcp and break at import time instead of
    # at install time.
    "mcp<2",
    # OTLP span export (miragen/telemetry.py). Same floor as mira-sdk's
    # telemetry module — the two must speak the same wire format and
    # attribute vocabulary (mira.* resource attributes, OTLP/HTTP).
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    # Coverage is one of the code-health lane's measured quantities. Without
    # it the snapshot records coverage as unmeasured, which is honest but
    # leaves a real gap in the series.
    "pytest-cov>=5.0",
]
# Executor backend tier (self-harnessed executors). `openai-codex` is OpenAI's
# App Server JSON-RPC SDK (AsyncCodex → threads → turns → notifications), which
# supersedes the legacy `openai-codex-sdk` CLI wrapper: it adds ChatGPT
# subscription auth and a host-answerable command-approval channel (issue #38).
codex = [
    "openai-codex>=0.144",
]
# Claude Code executor backend (claude-agent-sdk is the official Anthropic
# package; the spawn backend needs no extra at all).
claude-code = [
    "claude-agent-sdk>=0.1.0",
]
# Kimi Code executor backend (kimi-agent-sdk wraps the Kimi Code / kimi-cli
# runtime; subscription OAuth lives under KIMI_CODE_HOME — see
# docs/design/subscription-homes.md).
kimi-code = [
    "kimi-agent-sdk>=0.0.5",
]
# Grok Build client (MIT, in-repo). Install from monorepo path; also baked into
# the published Docker image. Optional if you only use other backends.
grok-build = [
    "grok-build-client>=0.1.0",
]
# miragend — the swarm lifecycle daemon (miragen/daemon/). The only process
# that holds the Docker socket; miragen-mcp and mirarun are HTTP clients of
# it. fastapi/uvicorn/apscheduler/httpx are already core dependencies; the
# extra adds the Docker SDK and sqlalchemy (persistent retrigger job store).
daemon = [
    "docker>=7.0",
    "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/ieepirzy/miragen"
Repository = "https://github.com/ieepirzy/miragen"
Issues = "https://github.com/ieepirzy/miragen/issues"
Documentation = "https://github.com/ieepirzy/miragen/blob/main/README.md"

[project.scripts]
miragen = "miragen.cli:cli"
miragend = "miragen.daemon.api:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["miragen"]

# ---------------------------------------------------------------------------
# Code health and provenance telemetry (mira-vitals).
#
# CI orchestrates, the repository configures, and neither holds the data
# model: `.github/workflows/test.yml` calls the reusable workflow, and what
# gets measured in *this* repository is declared here, versioned and
# reviewable.
[tool.mira_vitals]
# Both maintained packages: `miragen` and the `grok_build_client` distributed
# from `packages/`. Excluding the latter would leave a quarter of the code
# this repository maintains outside every series; including its `tests/` would
# mix test complexity into a maintainability figure, which is why the path
# names the package directory rather than the project directory.
paths = ["miragen", "packages/grok-build-client/grok_build_client"]

# Lint is measured wider, because an unused import in a test is still a real
# finding worth trending.
lint_paths = ["miragen", "packages", "tests"]

# Measured everywhere, gated nowhere yet. At adoption `miragen/` has 6 ruff
# findings (4 W292, 2 F401) and `tests/` has 85 (63 E402, 19 F401, ...).
# Gating on day one would fail the build over a missing newline at end of
# file and force exactly the unrelated cleanup this lane must not cause. The
# findings are recorded and trended from the first run instead; this flips to
# true once the baseline reaches zero.
lint_blocking = false

# The ruff rule selection, declared explicitly rather than left to ruff's
# defaults. Without it `lint.total` means "whatever this version of ruff
# selects by default", which is not a stable metric: the same origo commit
# measured 12 findings under ruff 0.15.8 and 153 under 0.16.4. E1/E2/E3/E5
# (whitespace, line length) are excluded deliberately -- E501 would dominate
# the number with a signal about line width rather than code health.
lint_select = ["E4", "E7", "E9", "F", "W"]

typecheck_paths = ["miragen", "packages/grok-build-client/grok_build_client"]
type_checker = "pyright"
# Measured from the first run, gated only once the baseline reaches zero.
typecheck_blocking = false

hotspot_limit = 20

# Provenance is configuration, not code: the collector ships knowing about no
# orchestrator and no label scheme. The *schema* lives here because it is a
# property of this repository's conventions -- versioned, reviewable in a pull
# request, identical across runs. The *values* arrive as environment variables
# at run time, because only whatever launched the run knows them. Nothing is
# ever inferred from commit messages, author names or branch prefixes.
[tool.mira_vitals.provenance.labels]
"authoring:human" = "human"
"authoring:human-assisted" = "human_assisted"
"authoring:agent-supervised" = "agent_supervised"
"authoring:agent-autonomous" = "agent_autonomous"
"authoring:mixed" = "mixed"

# MiraRun is this ecosystem's agent orchestrator. It contributes nothing
# unless `MIRARUN_RUN_ID` is set: a named agent with no run to point at is an
# assertion, not a record.
[[tool.mira_vitals.provenance.agent_sources]]
name = "mirarun"
env = { run_id = "MIRARUN_RUN_ID", name = "MIRARUN_AGENT_NAME", provider = "MIRARUN_AGENT_PROVIDER", model = "MIRARUN_MODEL", authoring_mode = "MIRARUN_AUTHORING_MODE", environment_id = "MIRARUN_ENVIRONMENT_ID" }
