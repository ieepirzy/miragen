name: miragen

# ============================================================
# COMPOSE — miragend, the swarm lifecycle daemon
#
# This is the deployable unit needed to make mirarun (or miragen-mcp) usable:
# the one process that holds the Docker socket and owns the swarm workspace
# (agents/, compose.yml, exports/) under MIRAGEN_WORKSPACE. mirarun and
# miragen-mcp never touch Docker themselves -- they are HTTP clients of this
# daemon, and it is what creates/starts/stops the agent containers they ask
# for. Hand-written, statically-declared agents are a separate concern (see
# compose.example.yml) -- this file does not declare any.
#
# Usage:
#   cp .env.example .env   # then fill in MIRAGEND_TOKEN / MIRAGEN_INTERNAL_TOKEN
#   docker compose up -d
#
# On the same host, point mirarun at it via mirarun's own .env:
#   MIRARUN_MIRAGEN_URL=http://host.docker.internal:${MIRAGEND_PORT:-8000}
#   MIRARUN_MIRAGEN_TOKEN=<same value as MIRAGEND_TOKEN below>
# ============================================================

services:
  miragend:
    image: ${MIRAGEND_IMAGE:-ghcr.io/ieepirzy/miragend:latest}
    container_name: miragend
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Must be an identical path inside and outside the container: miragend
      # drives `docker compose` for spawned agents against this workspace,
      # but that subprocess talks to the HOST's Docker daemon over the
      # mounted socket above, which resolves the agent compose file's
      # relative bind mounts (./agents/<name>:/agent) against ITS OWN
      # filesystem -- so the workspace path has to be a real, matching path
      # on the host. A named volume does not satisfy this.
      - ${MIRAGEN_WORKSPACE:-/opt/miragen}:${MIRAGEN_WORKSPACE:-/opt/miragen}
    env_file:
      # The daemon can only forward credentials that reach ITS OWN
      # environment (per-profile credential grants, the passthrough list and
      # the subscription-token forward all read os.environ). Loading the
      # operator env file wholesale here means "set the variable" is the
      # whole operator surface -- no per-credential declaration line on this
      # service. Which agent then receives a key is the agent's profile's
      # call, not this file's (docs/credential-grants.md). `.env` covers plain docker compose; `stack.env` is the same
      # mechanism under Portainer-managed stacks. Both optional.
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      # The in-container listen address is NOT an operator knob, and pinning
      # it here is load-bearing: `environment` overrides `env_file`, and the
      # wholesale .env load above would otherwise hand the daemon the
      # operator's own MIRAGEND_PORT -- which in `ports:` below means the
      # HOST publish port, but which the daemon reads as its BIND port
      # (daemon/api.py). One name, two meanings: an operator publishing on
      # 8183 silently moved the daemon off 8000, leaving the container's
      # EXPOSE/HEALTHCHECK port dead, the healthcheck failing, and every
      # client dialing miragend:8000 refused (mirarun answered 503
      # "lifecycle daemon request failed"). Pinned, the two meanings stop
      # colliding: publish wherever you like, the daemon always serves 8000.
      MIRAGEND_HOST: 0.0.0.0
      MIRAGEND_PORT: "8000"
      MIRAGEN_WORKSPACE: ${MIRAGEN_WORKSPACE:-/opt/miragen}
      MIRAGEN_BASE_IMAGE: ${MIRAGEN_BASE_IMAGE:-ghcr.io/ieepirzy/miragen:latest}
      # Env var NAMES the daemon forwards from its own environment into
      # EVERY agent container it writes, outside the per-profile grants --
      # for non-credential settings and operator-specific values that are
      # not *_API_KEY keys. Values arrive via the env_file above; the
      # declarations below exist only so a deployment that injects env some
      # other way (shell exports, CI) still works. Never list a *_API_KEY or
      # CLAUDE_CODE_OAUTH_TOKEN here (miragend warns at startup if you do):
      # a provider key reaches an agent whose profile implies or grants it,
      # and the token reaches agents that run Claude Code, with no entry
      # (docs/credential-grants.md).
      MIRAGEND_AGENT_ENV_PASSTHROUGH: ${MIRAGEND_AGENT_ENV_PASSTHROUGH:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      MIRAGEND_TOKEN: ${MIRAGEND_TOKEN:-}
      MIRAGEN_INTERNAL_TOKEN: ${MIRAGEN_INTERNAL_TOKEN:-}
      # Providers agent_type: external / hybrid profiles may use (pydantic-ai
      # provider names, comma-separated); the daemon forwards the list into
      # every agent it creates. Unset, it defaults to anthropic only: the
      # transfer analysis for customer chats covers Anthropic alone (mirarun
      # ADR-036, Decision 5), and mirarun's MIRARUN_CUSTOMER_FACING_PROVIDERS
      # defaults the same way -- keep the two in step. Add a provider only once
      # its DPA and transfer basis are covered. `-`, not `:-`: an explicitly
      # empty value is kept and refuses every external/hybrid profile. (The
      # code itself still fails closed when the variable is absent, for
      # deployments that do not start from this file.)
      MIRAGEN_EXTERNAL_ALLOWED_PROVIDERS: ${MIRAGEN_EXTERNAL_ALLOWED_PROVIDERS-anthropic}
    ports:
      # Loopback-bound by default: mirarun reaches this over the host's own
      # network stack (host.docker.internal), not a shared Docker network,
      # matching mirarun's MIRARUN_MIRAGEN_URL default. Not 0.0.0.0 -- an
      # unguarded (empty MIRAGEND_TOKEN) daemon holding the Docker socket
      # should never be reachable beyond the host it runs on.
      # MIRAGEND_PORT here is the HOST side only -- the container always
      # serves 8000 (pinned in `environment` above, matching EXPOSE and the
      # HEALTHCHECK).
      - 127.0.0.1:${MIRAGEND_PORT:-8000}:8000
    networks:
      # Agents miragend creates are attached here (container-name DNS); the
      # daemon also needs to be on it for control planes that DO share this
      # Docker network (e.g. miragen-mcp colocated on the same host).
      - miragen-net
    security_opt:
      - no-new-privileges:true

networks:
  # Created by compose if absent, and by miragend itself at startup
  # (ensure_network) so agents it spawns can always attach to it.
  miragen-net:
    name: miragen-net
