name: agents-host

# ============================================================
# The agents host's lifecycle stack (mirarun ADR-041 §8, mirarun#180).
#
# One miragend that runs engineer-lane containers on this host, reachable by
# MiraRun (on another host) over WireGuard only, plus `lanes-gateway`, which
#   - publishes each agent's API to MiraRun on the same WireGuard address
#     (MiraRun sends turns to the agent directly, not through miragend), and
#   - is the `github-broker` engineers dial: a TLS pass-through to MiraRun's
#     GitHub broker over the WireGuard link, so engineers use the same
#     broker URL as on the MiraRun host and hold no GitHub token.
#
# Deployed as a Portainer stack on the agents host; runbook in README.md.
# Every address and secret comes from stack.env and files under
# AGENTS_HOST_SECRETS_DIR. Nothing here is specific to one deployment.
#
# Networks (all with fixed names; miragend attaches agents by name):
#   lanes-control  internal  miragend, lanes-gateway, agents  (lifecycle + turns)
#   lanes-egress   no ICC    agents only                      (internet; egress open in v1)
#   lanes-broker   internal  lanes-gateway (as github-broker), agents
#   default                  miragend, lanes-gateway          (port publishing only)
# Engineers never join the default network or miragen-net. The host's
# AGENTS-EGRESS guard (movingfirm-infra agents-host/cloud-init.yaml) still
# refuses every container's NEW connections into the mesh, 10.0.0.0/16 and
# the metadata service, except the broker entry in /etc/agents-egress-allow.
# ============================================================

services:
  miragend:
    image: ${MIRAGEND_IMAGE:-ghcr.io/ieepirzy/miragend:latest}
    container_name: miragend
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Identical path inside and outside: agent compose files bind
      # ./agents/<name> relative to it on the HOST (see ../../compose.yaml).
      - ${MIRAGEN_WORKSPACE:-/opt/miragen-lanes}:${MIRAGEN_WORKSPACE:-/opt/miragen-lanes}
      - miragend-state:/var/lib/miragend
      # Secret files on the host, owned by uid 1000 (miragend's unprivileged
      # user), mode 0400. Never in git, never in stack.env.
      - type: bind
        source: ${AGENTS_HOST_SECRETS_DIR:?set AGENTS_HOST_SECRETS_DIR (host directory of secret files)}
        target: /run/agents-host-secrets
        read_only: true
    env_file:
      # Portainer writes the stack's variables here. It holds names, paths
      # and addresses only: every credential is a *_FILE pointing into
      # /run/agents-host-secrets. Per-lane broker credentials are added the
      # same way (GH_BROKER_<LANE>_API_KEY_FILE=...), with no change here.
      - path: stack.env
        required: false
    environment:
      MIRAGEND_HOST: 0.0.0.0
      MIRAGEND_PORT: "8000"
      MIRAGEN_WORKSPACE: ${MIRAGEN_WORKSPACE:-/opt/miragen-lanes}
      MIRAGEND_STATE_DIR: /var/lib/miragend
      # Every agent runs the engineer image. Pin it (a digest or sha- tag).
      MIRAGEN_BASE_IMAGE: ${ENGINEER_IMAGE:?set ENGINEER_IMAGE (ghcr.io/ieepirzy/miragen-engineer@sha256:...)}
      # Credentials, from files. The daemon resolves *_FILE at startup.
      MIRAGEND_TOKEN_FILE: /run/agents-host-secrets/miragend_token
      MIRAGEN_INTERNAL_TOKEN_FILE: /run/agents-host-secrets/miragen_internal_token
      # The subscription token reaches only agents that run Claude Code
      # (docs/credential-grants.md); nothing else receives it.
      CLAUDE_CODE_OAUTH_TOKEN_FILE: /run/agents-host-secrets/claude_code_oauth_token
      # Plugin tokens. An agent receives one only when its profile lists it
      # under `credentials:` (per-profile grants).
      MIRADESIGN_API_KEY_FILE: /run/agents-host-secrets/miradesign_token
      MIRAGEN_BRIDGE_API_KEY_FILE: /run/agents-host-secrets/miragen_bridge_token
      # Agents attach to these, never to miragen-net (miragen#216).
      MIRAGEND_AGENT_NETWORKS: lanes-control,lanes-egress,lanes-broker
      # What MiraRun is told an agent's address is: lanes-gateway, on the
      # WireGuard address, by agent name.
      MIRAGEND_AGENT_ENDPOINT_TEMPLATE: http://${AGENTS_HOST_BIND_ADDRESS:?set AGENTS_HOST_BIND_ADDRESS (this host's WireGuard address)}:${GATEWAY_PUBLISH_PORT:-8001}/a/{name}
      # Durable record of every lifecycle action and credential grant.
      MIRAGEND_AUDIT_LOG: /var/lib/miragend/audit/miragend.jsonl
      # Non-secret engineer config every agent receives (names, values come
      # from stack.env): the MiraDesign and memory bridge URLs, and the
      # broker's CA (base64 PEM) when it is not publicly trusted.
      MIRAGEND_AGENT_ENV_PASSTHROUGH: MIRADESIGN_URL,MIRAGEN_MEMORY_URL,ENGINEER_EXTRA_CA_B64
      MIRAGEND_MAX_AGENTS: ${MIRAGEND_MAX_AGENTS:-4}
      MIRAGEND_AGENT_MEM_LIMIT: ${MIRAGEND_AGENT_MEM_LIMIT:-3g}
      MIRAGEND_AGENT_CPU_LIMIT: ${MIRAGEND_AGENT_CPU_LIMIT:-2}
      MIRAGEN_EXTERNAL_ALLOWED_PROVIDERS: ""
    ports:
      # The lifecycle API on the WireGuard address only. Docker-published
      # ports bypass ufw, so the bind address IS the guard.
      - ${AGENTS_HOST_BIND_ADDRESS}:${MIRAGEND_PUBLISH_PORT:-8000}:8000
    networks:
      default: {}
      lanes-control: {}
    security_opt:
      - no-new-privileges:true

  lanes-gateway:
    image: ${GATEWAY_IMAGE:-nginx:1.27.5-alpine}
    container_name: lanes-gateway
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    command: ["nginx", "-c", "/etc/lanes-gateway/nginx.conf", "-g", "daemon off;"]
    configs:
      - source: lanes-gateway-nginx
        target: /etc/lanes-gateway/nginx.conf
    volumes:
      # Access log of every proxied agent call (turns included): JSON lines.
      - gateway-logs:/var/log/lanes-gateway
    ports:
      - ${AGENTS_HOST_BIND_ADDRESS}:${GATEWAY_PUBLISH_PORT:-8001}:8001
    networks:
      default: {}
      lanes-control: {}
      lanes-broker:
        aliases:
          # The broker's name everywhere (mirarun compose: github-broker on
          # mirarun-broker-net), so profiles and the broker's TLS name are
          # the same on both hosts.
          - github-broker
    security_opt:
      - no-new-privileges:true

volumes:
  miragend-state:
  gateway-logs:

configs:
  # Inline so the stack is one file (a Portainer git stack on an agent
  # environment cannot bind files from the repository). Compose fills the
  # ${...} values from stack.env; nginx's own variables are written $$name.
  lanes-gateway-nginx:
    content: |
      worker_processes 1;
      pid /var/run/nginx.pid;
      error_log stderr warn;
      events { worker_connections 256; }

      # Engineers dial github-broker:8080 (this container's alias on
      # lanes-broker); the bytes go to MiraRun's broker over WireGuard
      # untouched. TLS is end to end: the gateway sees no credential.
      stream {
        log_format broker escape=json '{"ts":"$$time_iso8601","client":"$$remote_addr","upstream":"$$upstream_addr","status":$$status,"sent":$$bytes_sent,"received":$$bytes_received,"duration_s":$$session_time}';
        access_log /var/log/lanes-gateway/broker.jsonl broker;
        server {
          listen 8080;
          proxy_pass ${BROKER_UPSTREAM:?set BROKER_UPSTREAM (broker address:port on the MiraRun host)};
          proxy_connect_timeout 10s;
          proxy_timeout 15m;
        }
      }

      http {
        server_tokens off;
        # Docker's embedded DNS: agent names resolve on lanes-control.
        resolver 127.0.0.11 valid=10s ipv6=off;
        log_format turns escape=json '{"ts":"$$time_iso8601","client":"$$remote_addr","agent":"$$agent","method":"$$request_method","path":"$$rest","status":$$status,"bytes":$$body_bytes_sent,"duration_s":$$request_time}';
        access_log /var/log/lanes-gateway/agents.jsonl turns;
        client_max_body_size 16m;

        server {
          listen 8001;
          # MiraRun's address only (the WireGuard peer). The agent's own
          # token (X-Miragen-Token) is still checked by the agent.
          allow ${MIRARUN_SOURCE_ADDRESS:?set MIRARUN_SOURCE_ADDRESS (MiraRun host's WireGuard address)};
          deny all;

          location = /healthz { access_log off; return 200 "ok"; }

          # /a/<agent>/<path> -> http://<agent>:8000/<path>, lane agents only.
          location ~ ^/a/(?<agent>${LANE_AGENT_PREFIX:-lane-}[a-z0-9-]+)(?<rest>/.*)$$ {
            proxy_pass http://$$agent:8000$$rest$$is_args$$args;
            proxy_http_version 1.1;
            proxy_set_header Host $$agent:8000;
            proxy_set_header Connection "";
            # Turns stream and can run long.
            proxy_buffering off;
            proxy_read_timeout 15m;
            proxy_send_timeout 15m;
          }

          location / { return 404; }
        }
      }

networks:
  lanes-control:
    name: lanes-control
    internal: true
  lanes-egress:
    name: lanes-egress
    driver: bridge
    driver_opts:
      # Agents reach the internet here, never each other.
      com.docker.network.bridge.enable_icc: "false"
  lanes-broker:
    name: lanes-broker
    internal: true
