name: Engineer image (build check)

# Builds Dockerfile.engineer on pull requests that touch it, without pushing,
# FROM the published miragen image: proves the native Claude Code install,
# the plugin layout and the entrypoint parse before anything is published.
# publish.yml publishes it on main, FROM the miragen image of the same commit.
on:
  pull_request:
    paths:
      - Dockerfile.engineer
      - deploy/engineer/**
      - plugins/miragen-memory/**
      - .claude-plugin/marketplace.json
      - .github/workflows/engineer-image.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.engineer
          push: false
          load: true
          tags: miragen-engineer:check
          # Pinned by digest (review round 1): bump deliberately.
          build-args: |
            MIRAGEN_IMAGE=ghcr.io/ieepirzy/miragen@sha256:823d44f31b57127621e9048dcd832010bace97a0970a33aa9fc8d68b1570bfa8

      - name: Smoke-test the image
        run: |
          set -eu
          docker run --rm --entrypoint claude miragen-engineer:check --version
          docker run --rm --entrypoint sh miragen-engineer:check -c '
            set -eu
            id -un | grep -qx agentuser
            test "$CLAUDE_BIN" = /usr/local/bin/claude
            test -f /opt/engineer/marketplaces/miragen/plugins/miragen-memory/.claude-plugin/plugin.json
            git --version && gh --version >/dev/null
            test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}${GH_ENTERPRISE_TOKEN:-}"
          '
          # Exactly the hardening miragend applies to an isolated agent
          # (MIRAGEND_ISOLATED_AGENTS): read-only root, tmpfs scratch, no
          # capabilities, no-new-privileges, a pid limit.
          HARDEN="--read-only --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 512
            --tmpfs /tmp:size=512m,mode=1777
            --tmpfs /run/engineer:uid=1000,gid=1000,mode=0700,size=16m"
          ws=$(mktemp -d); mkdir -p "$ws/agent"
          printf 'name: lane-check\nmode: interactive\ntriggers:\n  - type: http\nspec:\n  model: "test:whatever"\n  instructions: "check"\n' > "$ws/agent/agent.yaml"
          sudo chown -R 1000:1000 "$ws/agent"
          # The entrypoint end to end, with no daemon reachable: credentials
          # become files and leave the environment, miragen-memory installs
          # from the baked marketplace, then it execs the given command.
          docker run --rm $HARDEN -v "$ws/agent:/agent" \
            -e MIRAGEN_MEMORY_URL=https://memory.invalid \
            -e MIRAGEN_BRIDGE_API_KEY=fake-bridge \
            -e GH_BROKER_CHECK_API_KEY=fake-broker \
            -e MIRAGEN_INTERNAL_TOKEN=fake-agent-token \
            miragen-engineer:check sh -c '
              set -eu
              cat /run/engineer/status.json
              test -z "${MIRAGEN_BRIDGE_API_KEY:-}${GH_BROKER_CHECK_API_KEY:-}${MIRAGEN_INTERNAL_TOKEN:-}"
              test "$(cat "$MIRAGEN_INTERNAL_TOKEN_FILE")" = fake-agent-token
              test "$(cat /run/engineer/secrets/broker_credential)" = fake-broker
              grep -A1 "\"miragen-memory\"" /run/engineer/status.json | grep -q "\"installed\": true"
              grep -q "\"miragen-memory@miragen\": true" /agent/claude-home/settings.json
              ! grep -rq fake-bridge /agent/claude-home/settings.json
              ! find / -xdev -type f -perm /6000 2>/dev/null | grep -q .
            '
          # miragen itself under the same hardening: it boots and serves
          # /health, and PID 1's environment holds no credential value.
          docker run -d --name engineer-check $HARDEN -v "$ws/agent:/agent" \
            -e MIRAGEN_INTERNAL_TOKEN=fake-agent-token miragen-engineer:check
          ok=0
          for i in $(seq 1 30); do
            if docker exec engineer-check curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          docker logs engineer-check 2>&1 | tail -40
          test "$ok" = 1
          ! docker exec engineer-check sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -q fake-agent-token
          docker rm -f engineer-check
          docker image inspect miragen-engineer:check --format '{{ index .Config.Labels "io.miragen.profile-contracts" }}' | grep -q 4
