name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    # test.yml's code-health job calls a reusable workflow of its own, and a
    # called workflow's jobs cannot request permissions greater than the
    # calling job's -- exceeding them fails the run before any job starts,
    # with `startup_failure` and no log. Without this block the job would
    # inherit only the repository's default token grant, so the nested call
    # has to be covered here as well as in test.yml.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/test.yml
    secrets: inherit

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The engineer image builds FROM exactly this image (by digest).
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,suffix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Record build start
        id: build_start
        run: echo "ts=$(date +%s.%N)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Best-effort fleet build-telemetry push (image footprint, layer count,
      # build duration) to the vitals collector's OTLP /v1/metrics and /v1/logs — see
      # scripts/report_build_telemetry.py's docstring (movingfirm-admin#120).
      # No-ops cleanly while CODE_HEALTH_TOKEN is unavailable; never fails this
      # job either way.
      - name: Report build telemetry
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          # The vitals collector (movingfirm-analytics#14), same token as the
          # code-health report. Empty, so the script skips, wherever that
          # secret is unavailable (forks, Dependabot, a repo without it).
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.CODE_HEALTH_TOKEN && 'https://vitals.muutto365.fi' || '' }}
          OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer%20${{ secrets.CODE_HEALTH_TOKEN }}
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_STARTED_AT: ${{ steps.build_start.outputs.ts }}
          REPO: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_NAME: publish
        run: python3 scripts/report_build_telemetry.py

  # miragend — the swarm lifecycle daemon (Dockerfile.miragend). Published as
  # its own image so miragen-mcp's compose stack can pull it prebuilt.
  publish-miragend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/miragend
          tags: |
            type=ref,event=branch,suffix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Record build start
        id: build_start
        run: echo "ts=$(date +%s.%N)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.miragend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Written to /app/BUILD_REVISION: the Sentry release (miragen.observability).
          build-args: |
            BUILD_REVISION=${{ github.sha }}

      # Best-effort fleet build-telemetry push (image footprint, layer count,
      # build duration) to the vitals collector's OTLP /v1/metrics and /v1/logs — see
      # scripts/report_build_telemetry.py's docstring (movingfirm-admin#120).
      # No-ops cleanly while CODE_HEALTH_TOKEN is unavailable; never fails this
      # job either way.
      - name: Report build telemetry
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          # The vitals collector (movingfirm-analytics#14), same token as the
          # code-health report. Empty, so the script skips, wherever that
          # secret is unavailable (forks, Dependabot, a repo without it).
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.CODE_HEALTH_TOKEN && 'https://vitals.muutto365.fi' || '' }}
          OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer%20${{ secrets.CODE_HEALTH_TOKEN }}
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_STARTED_AT: ${{ steps.build_start.outputs.ts }}
          REPO: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_NAME: publish-miragend
        run: python3 scripts/report_build_telemetry.py

  # miragen-engineer — the engineer-lane image (Dockerfile.engineer, mirarun
  # ADR-041): FROM the miragen image published above, by digest, so the
  # profile-contract label and runtime are exactly that build's.
  publish-engineer:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/miragen-engineer
          tags: |
            type=ref,event=branch,suffix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.engineer
          push: true
          build-args: |
            MIRAGEN_IMAGE=ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Digest
        run: echo "ghcr.io/${{ github.repository_owner }}/miragen-engineer@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
